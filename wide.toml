# Раскладка wvkbd "wide": широкая клавиатура как на ПК (6 рядов).
# После правки: python3 mkwide.py && make LAYOUT=wide wvkbd-wide
#
# Ряд - строка ключей через пробел, ширина после двоеточия (по умолчанию 1.0).
# Сумма ширин в каждом ряду должна быть одинаковой (здесь 18.5), иначе ряды
# растянутся неровно (генератор предупредит).

[settings]
name = "wide"                 # собирается как LAYOUT=wide, бинарник wvkbd-wide
height = 300                  # высота в пикселях (портрет)
landscape_height = 300        # высота в пикселях (ландшафт, твой экран 1920x1080)
font = "Sans 12"
layers = ["en", "ru"]         # слои по умолчанию (первый - стартовый)
landscape_layers = ["en", "ru"]

# Свои именованные клавиши: l - метка, s - метка на shift,
# type - Code | Mod | Copy, code - KEY_* / имя модификатора / unicode (для Copy)
[keys]
# Copy-клавиши вводят символ, которого нет в кириллическом keymap
cslash  = { l = "/",  s = "/",  type = "Copy", code = "0x2F" }
cbslash = { l = "\\", s = "|",  type = "Copy", code = "0x5C" }
# Комбинации: нажатие = Ctrl+клавиша; удержание (>= 450 мс) - другое действие.
# В терминале нужен Ctrl+Shift: нажми Shift (он одноразовый) и потом Cp/Paste.
[keys.Cp]
l = "Cp"
s = "Cp"
type = "Code"
code = "KEY_C"
mod = "Ctrl"
scheme = 1
hold_code = "KEY_X"            # удержание = вырезать
hold_mod = "Ctrl"

[keys.Paste]
l = "Paste"
s = "Paste"
type = "Code"
code = "KEY_V"
mod = "Ctrl"
scheme = 1
hold_cmd = "$HOME/.local/bin/clipd pick --paste"   # удержание = меню буфера обмена

[keys.Menu]
l = "Menu"
s = "Menu"
type = "Code"
code = "KEY_MENU"
scheme = 1
tap_cmd = "$HOME/.local/bin/osk-tray menu"      # короткое нажатие = меню значка (там же переключение плавающая/полная)
hold_code = "KEY_MENU"                          # удержание = настоящая клавиша Menu (контекстное меню приложения)

# Команды Ctrl+клавиша (страницы символов, верхний ряд)
[keys.Undo]
l = "Undo"
s = "Undo"
type = "Code"
code = "KEY_Z"
mod = "Ctrl"
scheme = 1

[keys.Redo]
l = "Redo"
s = "Redo"
type = "Code"
code = "KEY_Y"
mod = "Ctrl"
scheme = 1

[keys.Find]
l = "Find"
s = "Find"
type = "Code"
code = "KEY_F"
mod = "Ctrl"
hold_code = "KEY_H"                  # удержание = «Заменить» (Ctrl+H)
hold_mod = "Ctrl"
scheme = 1

[keys.SelAll]
l = "All"
s = "All"
type = "Code"
code = "KEY_A"
mod = "Ctrl"
scheme = 1

[keys.Save]
l = "Save"
s = "Save"
type = "Code"
code = "KEY_S"
mod = "Ctrl"
hold_code = "KEY_S"                  # удержание = «Сохранить как» (Ctrl+Shift+S)
hold_mod = "Ctrl | Shift"
scheme = 1

[keys.Open]
l = "Open"
s = "Open"
type = "Code"
code = "KEY_O"
mod = "Ctrl"
scheme = 1

[keys.New]
l = "New"
s = "New"
type = "Code"
code = "KEY_N"
mod = "Ctrl"
scheme = 1

[keys.Print]
l = "Print"
s = "Print"
type = "Code"
code = "KEY_P"
mod = "Ctrl"
scheme = 1

[keys.Bold]
l = "Bold"
s = "Bold"
type = "Code"
code = "KEY_B"
mod = "Ctrl"
scheme = 1

[keys.Italic]
l = "Ital"
s = "Ital"
type = "Code"
code = "KEY_I"
mod = "Ctrl"
scheme = 1

[keys.Under]
l = "Undl"
s = "Undl"
type = "Code"
code = "KEY_U"
mod = "Ctrl"
scheme = 1

[keys.Close]
l = "Close"
s = "Close"
type = "Code"
code = "KEY_W"
mod = "Ctrl"
scheme = 1


[layout.en]
keymap = "latin"
label = "EN"
primary = true
rows = [
  "Esc _:1 F1 F2 F3 F4 _:0.5 F5 F6 F7 F8 _:0.5 F9 F10 F11 F12 _:0.5 PrtSc ScrLk Pause",
  "grave 1 2 3 4 5 6 7 8 9 0 minus equal Bksp:2 _:0.5 Ins Home PgUp",
  "Tab:1.5 q w e r t y u i o p lbrace rbrace bslash:1.5 _:0.5 Del End PgDn",
  "Caps:1.75 a s d f g h j k l semi apos Enter:2.25 _:3.5",
  "Shift:2.25 z x c v b n m comma dot slash Shift:1.25 Cp:0.75 Paste:0.75 _:1.5 Up _:1",
  "Ctrl:1.25 Win:1.25 Alt:1.25 Space:6.25 AltGr:1.25 >ru+s1:1.25 Menu:1.25 Ctrl:1.25 _:0.5 Left Down Right",
]

[layout.ru]
keymap = "cyrillic"
label = "RU"
primary = true
rows = [
  "Esc _:1 F1 F2 F3 F4 _:0.5 F5 F6 F7 F8 _:0.5 F9 F10 F11 F12 _:0.5 PrtSc ScrLk Pause",
  "ё=GRAVE 1 2 3 4/;=4 5 6/:=6 7 8 9 0 minus ,/'=EQUAL Bksp:2 _:0.5 Ins Home PgUp",
  "Tab:1.5 й=Q ц=W у=E к=R е=T н=Y г=U ш=I щ=O з=P х=LEFTBRACE ъ=RIGHTBRACE cbslash:1.5 _:0.5 Del End PgDn",
  "Caps:1.75 ф=A ы=S в=D а=F п=G р=H о=J л=K д=L ж=SEMICOLON э=APOSTROPHE Enter:2.25 _:0.5 cslash _:2",
  "Shift:2.25 я=Z ч=X с=C м=V и=B т=N ь=M б=COMMA ю=DOT ./?=SLASH Shift:1.25 Cp:0.75 Paste:0.75 _:1.5 Up _:1",
  "Ctrl:1.25 Win:1.25 Alt:1.25 Space:6.25 AltGr:1.25 >en+s1:1.25 Menu:1.25 Ctrl:1.25 _:0.5 Left Down Right",
]

# Плавающие слои (первая строка: круглая кнопка слева вместо пустого места после Esc; переключение EN/RU между собой)
[layout.fen]
keymap = "latin"
label = "EN"
primary = true
rows = [
  "FBtn:1 Esc:1 F1 F2 F3 F4 _:0.5 F5 F6 F7 F8 _:0.5 F9 F10 F11 F12 _:0.5 PrtSc ScrLk Pause",
  "grave 1 2 3 4 5 6 7 8 9 0 minus equal Bksp:2 _:0.5 Ins Home PgUp",
  "Tab:1.5 q w e r t y u i o p lbrace rbrace bslash:1.5 _:0.5 Del End PgDn",
  "Caps:1.75 a s d f g h j k l semi apos Enter:2.25 _:3.5",
  "Shift:2.25 z x c v b n m comma dot slash Shift:1.25 Cp:0.75 Paste:0.75 _:1.5 Up _:1",
  "Ctrl:1.25 Win:1.25 Alt:1.25 Space:6.25 AltGr:1.25 >fru+fs1:1.25 Menu:1.25 Ctrl:1.25 _:0.5 Left Down Right",
]

[layout.fru]
keymap = "cyrillic"
label = "RU"
primary = true
rows = [
  "FBtn:1 Esc:1 F1 F2 F3 F4 _:0.5 F5 F6 F7 F8 _:0.5 F9 F10 F11 F12 _:0.5 PrtSc ScrLk Pause",
  "ё=GRAVE 1 2 3 4/;=4 5 6/:=6 7 8 9 0 minus ,/'=EQUAL Bksp:2 _:0.5 Ins Home PgUp",
  "Tab:1.5 й=Q ц=W у=E к=R е=T н=Y г=U ш=I щ=O з=P х=LEFTBRACE ъ=RIGHTBRACE cbslash:1.5 _:0.5 Del End PgDn",
  "Caps:1.75 ф=A ы=S в=D а=F п=G р=H о=J л=K д=L ж=SEMICOLON э=APOSTROPHE Enter:2.25 _:0.5 cslash _:2",
  "Shift:2.25 я=Z ч=X с=C м=V и=B т=N ь=M б=COMMA ю=DOT ./?=SLASH Shift:1.25 Cp:0.75 Paste:0.75 _:1.5 Up _:1",
  "Ctrl:1.25 Win:1.25 Alt:1.25 Space:6.25 AltGr:1.25 >fen+fs1:1.25 Menu:1.25 Ctrl:1.25 _:0.5 Left Down Right",
]

# ---------------------------------------------------------------------------
# Страницы символов: удержание кнопки языка (EN/RU) открывает их, Shift листает по кругу, «abc» возвращает к буквам.
# Каждая страница - ровно 46 символов (ряды 13+12+11+10 клавиш, как у буквенной раскладки); вводятся как Unicode.
# Страницы 3-9 - цветные эмодзи. Символы, которым для цвета нужен селектор (❤ ♻ ⚠ ✔ ☑), не берём - они чёрно-белые.
# top = "actions": верхний ряд - команды Ctrl+Z/Y/F/A/S/O/N/P/B/I/U/W; иначе обычные F-клавиши.

[[sym]]
top = "actions"
chars = """@`’´+-–—"':;“ {}«»±×÷~≈≠∞… №%^™©®℗§$£€ ¢₴•°¶₽₸¥₿₤"""

